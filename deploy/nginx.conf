# Template. setup.sh substitutes __DOMAIN__ with the DOMAIN value from .env
# (or `_` when unset) and writes the result to /etc/nginx/sites-available/shop.
# Do not put a real domain here — this file is public.

# Brute-force protection for the two login endpoints. Declared here rather than
# inside the server block because limit_req_zone belongs to the http context —
# this file is included from inside http by the packaged nginx.conf.
# 10 MB of state holds roughly 160k client addresses.
limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;

server {
    listen 80;
    server_name __DOMAIN__;

    # Max upload size (for future image uploads)
    client_max_body_size 10M;

    # Rejected requests are the client's fault, not an outage; the default 503
    # would tell monitoring the wrong story.
    limit_req_status 429;

    # Shared proxy settings. Declared at server level so every location below
    # inherits them instead of repeating the block.
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache_bypass $http_upgrade;

    # Invite codes and the admin password are both guessable given enough
    # attempts, and neither endpoint limits them itself. burst=5 leaves room
    # for a person mistyping a few times before throttling starts.
    location = /api/auth/invite {
        limit_req zone=login burst=5 nodelay;
        proxy_pass http://127.0.0.1:3000;
    }

    location = /api/admin/auth {
        limit_req zone=login burst=5 nodelay;
        proxy_pass http://127.0.0.1:3000;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
    }
}
