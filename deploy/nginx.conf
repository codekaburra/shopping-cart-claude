# Template. setup.sh substitutes __DOMAIN__ with the DOMAIN value from .env
# (or `_` when unset) and writes the result to /etc/nginx/sites-available/shop.
# Do not put a real domain here — this file is public.
server {
    listen 80;
    server_name __DOMAIN__;

    # Max upload size (for future image uploads)
    client_max_body_size 10M;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
